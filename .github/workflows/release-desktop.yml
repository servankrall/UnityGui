name: Build desktop app (.exe)

# Builds the UnityGUI Windows installer and publishes it to a GitHub Release.
#   • Push a tag like v1.0.2            → builds + publishes a release for that tag.
#   • Or run manually (Actions ▸ this workflow ▸ "Run workflow") and pass a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.3)"
        required: true
        default: "v1.0.3"

permissions:
  contents: write   # needed to create the Release and upload the .exe

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist
        env:
          # Unsigned build (no code-signing certificate). Windows SmartScreen may warn.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnityGUI-Windows
          path: desktop/dist/*.exe

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: UnityGUI ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            **UnityGUI desktop app** — generate complete **Unity _and_ Roblox Studio** games
            from a prompt, for free.

            Download `UnityGUI-Setup-*.exe` below and run it (one-click install). Connect a free
            AI provider (Gemini / Groq / Ollama), pick an engine, and describe a game — with
            **Auto-open** on it writes the project and opens it in the engine for you. Keep
            **chatting** to refine the game. You just press Play.

            - **Two engines:** Unity (C#) → full project · Roblox Studio (Luau) → `.rbxlx` place file
            - **Chats + refine**, **genre quick-starts**, **✨ Enhance**, in-app **code view**, **🔁 Regenerate**
            - **Auto-open, 100% free** (no paid Claude key)
            - **Self-healing models:** current Gemini ids + automatic fallback if a model is retired
              (no more *"models no longer usable"* dead ends)
          files: desktop/dist/*.exe
          draft: false
          prerelease: false
