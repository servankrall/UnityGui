name: Build desktop app (.exe)

# Builds the UnityGUI Windows installer and publishes it to a GitHub Release.
#   • Push a tag like v1.0.2            → builds + publishes a release for that tag.
#   • Or run manually (Actions ▸ this workflow ▸ "Run workflow") and pass a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.14)"
        required: true
        default: "v1.0.14"

permissions:
  contents: write   # needed to create the Release and upload the .exe

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist
        env:
          # Unsigned build (no code-signing certificate). Windows SmartScreen may warn.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnityGUI-Windows
          path: desktop/dist/*.exe

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: UnityGUI ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            **UnityGUI desktop app** — generate complete **Unity, Roblox Studio _and_ Web (HTML5)**
            games from a prompt, for free.

            Download `UnityGUI-Setup-*.exe` below and run it (one-click install). Connect a free
            AI provider (Gemini / Groq / Ollama), pick an engine, and describe a game — with
            **Auto-open** on it writes the project and opens it in the engine for you. Keep
            **chatting** to refine the game. You just press Play.

            - **Three engines:** Unity (C#) → full project · Roblox Studio (Luau) → `.rbxlx` place file · Web (HTML5/JS) → one `index.html`
            - **Opens straight in Unity** — the app launches the Unity Editor on the generated project (no Hub "Add" step)
            - **🎨 Asset pack** — attach photos or generate **multiple** free AI images (no key), name each (player/enemy/background); each is embedded as a real asset (Web sprite / Unity texture)
            - **🔎 Search & ⭐ favorite chats** (+ keyboard shortcuts) · **📄 Single-file `.html`** for Web (itch.io-ready) · **⚙️ Settings** to manage keys + your Unity.exe path
            - **In-app code editor** — for Web games, edit the code and **Save & re-run** the preview instantly
            - **🔧 Auto QA** — for Web games, catch runtime/console errors and let the AI **auto-fix** them in one click
            - **Web games play instantly** in-app with **▶ Play preview** — no engine, no install (procedural art + Web Audio sound)
            - **📁 My projects** gallery — re-open / preview / zip every game, with auto-captured thumbnails for Web
            - **One-tap prompt “spice”** — Harder · Levels · Power-ups · Particles · Neon · Retro · More SFX · High score
            - **Fix:** no more *"Unterminated string in JSON"* — big games that hit the token limit
              now auto-retry with a bigger budget (and salvage valid files) instead of erroring
            - **Never runs out:** paste multiple keys (auto-rotate), auto-fallback across
              providers, retry rate-limits, and drop to **unlimited local Ollama** (no key/limits)
            - **42 genre quick-starts**, **✨ Enhance**, in-app **code view**, **🔁 Regenerate**, **📦 Share .zip**
            - **Chats + refine**, **Auto-open**, **100% free** (no paid Claude key)
          files: desktop/dist/*.exe
          draft: false
          prerelease: false
