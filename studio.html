<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio — UnityGUI</title>
  <meta name="description" content="Generate Unity-ready UI, icons, sprites, 3D props and more from a text prompt." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/studio.css" />
</head>
<body class="studio">

  <div class="studio-shell">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-head">
        <a class="nav-logo" href="index.html"><img src="assets/logo.svg" alt="UnityGUI" /></a>
        <a class="btn btn-ghost btn-sm" href="index.html">← Home</a>
      </div>

      <div class="sidebar-body">
        <div class="field">
          <label for="prompt">Describe your asset</label>
          <textarea id="prompt" class="prompt" placeholder="Describe your asset…"></textarea>
          <div class="hint">Tip: press <b>⌘/Ctrl + Enter</b> to generate.</div>
        </div>

        <div class="field">
          <label>Need inspiration?</label>
          <div class="chip-row" id="idea-chips"></div>
        </div>

        <div class="field">
          <label>Asset type</label>
          <div class="type-grid" id="type-grid"></div>
        </div>

        <div class="field">
          <label>Style preset</label>
          <div class="chip-row" id="style-chips"></div>
        </div>

        <div class="field">
          <label>Export resolution</label>
          <div class="seg" id="res-seg"></div>
        </div>

        <div class="field">
          <label>Variations</label>
          <div class="range-row">
            <input type="range" id="count" min="1" max="8" step="1" value="4" />
            <span class="val" id="count-val">4</span>
          </div>
          <div class="hint">Each variation uses 1 credit.</div>
        </div>
      </div>

      <div class="sidebar-foot">
        <div class="credits">
          <span class="c-left">Credits remaining</span>
          <span class="c-num" id="credits-num">25</span>
        </div>
        <button class="btn btn-primary btn-block" id="gen-btn">✦ Generate</button>
        <button class="btn btn-ghost btn-sm btn-block" id="reset-credits" style="margin-top:8px">Top up demo credits</button>
      </div>
    </aside>

    <!-- MAIN CANVAS -->
    <main class="canvas">
      <div class="mobile-bar">
        <button class="icon-btn" id="mobile-menu" aria-label="Controls">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h14M3 11h14M3 16h14"/></svg>
        </button>
        <a class="nav-logo" href="index.html"><img src="assets/logo.svg" alt="UnityGUI" /></a>
      </div>

      <div class="canvas-top">
        <div>
          <h1 id="ctx-title">UI / GUI Kits</h1>
          <div class="ct-sub" id="ctx-sub"></div>
        </div>
        <div class="spacer"></div>
        <span class="badge badge-dot">Engine online</span>
      </div>

      <div class="canvas-body" id="canvas-body">
        <div class="empty" id="empty">
          <div class="em-art">
            <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.7 1.8L21.5 17.5 19.7 18.2 19 20l-.7-1.8L16.5 17.5l1.8-.7z"/></svg>
          </div>
          <h2>Let’s make something for your game</h2>
          <p>Pick an asset type, describe what you want, and hit generate. Your results appear here — download them straight into Unity.</p>
          <div class="em-ideas" id="idea-chips-2"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/generator.js"></script>
  <script src="js/studio.js"></script>
  <script>
    // mirror a few idea chips into the empty state
    (function () {
      const D = window.UnityGUIData, wrap = document.getElementById("idea-chips-2");
      if (D && wrap) {
        wrap.innerHTML = D.PROMPT_IDEAS.slice(0, 4).map(p =>
          `<button class="chip" onclick="(function(){var t=document.getElementById('prompt');t.value=${JSON.stringify(p)};t.focus();})()">${p}</button>`).join("");
      }
    })();
  </script>
</body>
</html>
