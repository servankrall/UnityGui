<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'" />
  <title>UnityGUI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="dot"></span>Unity<span>GUI</span></div>
    <div class="spacer"></div>
    <div class="chip off" id="conn-chip"><span class="live"></span><span id="conn-text">Not connected</span></div>
    <button class="link hidden" id="disconnect-btn">Disconnect</button>
  </div>

  <div class="wrap">
    <!-- CONNECT SCREEN -->
    <div class="center" id="connect-view">
      <div class="card">
        <span class="badge">● Free — no paid Claude key needed</span>
        <h1>Connect an AI provider</h1>
        <p class="sub">Pick a free provider and paste its key (or use Ollama locally with no key). Your key stays on this computer.</p>

        <label for="provider">Provider</label>
        <select id="provider"></select>

        <div id="key-block">
          <label class="mt2" for="key">API key</label>
          <input id="key" type="password" placeholder="paste your free key…" autocomplete="off" />
          <div class="hint" id="key-hint"></div>
        </div>

        <label class="mt2" for="c-model">Model</label>
        <select id="c-model"></select>

        <button class="btn btn-primary btn-block btn-lg mt2" id="connect-btn">Connect</button>
        <button class="link mt" id="get-key-btn" style="background:none;border:0;color:var(--violet2);cursor:pointer;font-size:.85rem;width:100%">Get a free key →</button>
        <div class="status" id="connect-status"></div>
      </div>
    </div>

    <!-- APP: conversations + generator -->
    <div class="layout hidden" id="app-view">
      <!-- Conversations sidebar -->
      <aside class="side">
        <button class="btn btn-primary btn-block" id="new-chat">＋ New chat</button>
        <div class="convos" id="convos"></div>
      </aside>

      <!-- Main -->
      <main class="main">
        <div class="controls">
          <div>
            <label for="engine">Engine</label>
            <select id="engine"></select>
          </div>
          <div>
            <label for="style">Style</label>
            <select id="style">
              <option value="auto">Auto</option>
              <option value="2d">2D</option>
              <option value="3d">3D</option>
            </select>
          </div>
          <div class="autoopen">
            <label class="chkline"><input type="checkbox" id="auto-open" /> Auto-open when done</label>
          </div>
        </div>

        <div class="turns" id="turns"></div>

        <div class="composer">
          <textarea id="prompt" placeholder="Describe your game… (e.g. a 2D runner where a cube jumps over obstacles, space to jump)"></textarea>
          <div class="composer-row">
            <div class="chips" id="ideas"></div>
            <button class="btn btn-primary" id="generate-btn">✦ Generate</button>
          </div>
          <div class="status" id="gen-status"></div>
        </div>
      </main>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
